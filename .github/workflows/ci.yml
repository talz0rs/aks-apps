name: app-ci

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: src/requirements-dev.txt
      - name: Install dev tools
        run: pip install -r src/requirements-dev.txt
      - name: Lint
        run: ruff check src/
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            src/requirements.txt
            src/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r src/requirements.txt -r src/requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests/ -v
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile.api
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: src/Dockerfile.api
      - name: Lint Dockerfile.worker
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: src/Dockerfile.worker

